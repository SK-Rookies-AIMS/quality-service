server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${APP_NAME:quality-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    kafka:
      enabled: false

app:
  datasource:
    main:
      url: ${MAIN_DB_JDBC_URL}
      username: ${MAIN_DB_USERNAME}
      password: ${MAIN_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    sample:
      url: ${SAMPLE_DB_JDBC_URL}
      username: ${SAMPLE_DB_USERNAME}
      password: ${SAMPLE_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    cache:
      ttl: ${REDIS_CACHE_TTL:10m}
  opensearch:
    scheme: ${OPENSEARCH_SCHEME:http}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    group-id: ${KAFKA_GROUP_ID:assembly-local}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}

jwt:
  secret-key: ${JWT_SECRET_KEY:quality-service-local-jwt-secret-key-must-be-at-least-32-bytes}
  expiration:
    access: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh: ${JWT_REFRESH_EXPIRATION:1209600000}